<style>

body{
    margin:0;
    background:#202020;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

h1{
    text-align:center;
    margin:30px;
    font-size:40px;
}

.gallery{

    width:95%;
    margin:auto;

    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:20px;

}

.card{

    background:#303030;

    border-radius:10px;

    overflow:hidden;

    transition:.3s;

}

.card:hover{

    transform:scale(1.03);

}

.card img{

    width:100%;
    display:block;

}

.card h2{

    text-align:center;

    font-size:20px;

    margin:15px;

    color:white;

}

a{

    text-decoration:none;

}

</style>
