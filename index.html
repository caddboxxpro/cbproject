    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #e8f1e7;
            color: #17351d;
        }

        /* ---------- HEADER ---------- */

        header {
            background: #17351d;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: clamp(30px, 5vw, 52px);
            font-weight: 700;
        }

        header p {
            margin: 10px 0 0;
            font-size: clamp(15px, 2vw, 20px);
            opacity: 0.85;
        }

        /* ---------- MAIN ---------- */

        main {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 25px 60px;
        }

        .gallery {
            display: grid;

            /* Three equally sized columns */
            grid-template-columns: repeat(3, 1fr);

            /* Equal spacing */
            gap: 30px;
        }

        /* ---------- IMAGE BUTTON ---------- */





        
        .app-button {
            display: block;
            width: 100%;

            padding: 0;
            border: none;
            background: transparent;

            text-decoration: none;
            cursor: pointer;

            border-radius: 14px;

            overflow: hidden;

            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;            
        }

        #overlay {
              position: fixed;
              display: none;
              width: 100%;
              height: 100%;
              top: 0;
              left: 0;
              right: 0;
              bottom: 0;
              background-color: rgba(0,0,0,0.5);
              z-index: 2;
              cursor: pointer;
            }

        .app-button:hover {
            transform: translateY(-6px);

            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.25);
        }

        .app-button:active {
            transform: translateY(-2px);
        }

        .app-button img {
            display: block;

            width: 100%;

            /* Maintains the requested 600 × 700 ratio */
            aspect-ratio: 600 / 700;

            height: auto;

            object-fit: cover;
        }

        /* ---------- FOOTER ---------- */

        footer {
            text-align: center;
            padding: 25px;
            background: #17351d;
            color: white;
            font-size: 14px;
            opacity: 0.95;
        }

        /* ---------- TABLET ---------- */

        @media (max-width: 900px) {

            main {
                padding: 30px 20px 50px;
            }

            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 22px;
            }
        }

        /* ---------- PHONE ---------- */

        @media (max-width: 600px) {

            header {
                padding: 28px 15px;
            }

            main {
                padding: 20px 15px 40px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .app-button img {
                width: 100%;
            }
        }
    </style>
</head>
