    text-align:center;
    padding:30px 0;
    margin:0;
}

.gallery{
    width:95%;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:20px;
    padding-bottom:40px;
}

.card{
    background:#303030;
    border-radius:8px;
    overflow:hidden;
    transition:.25s;
}

.card:hover{
    transform:scale(1.03);
}

.card img{
    width:100%;
    display:block;
}

.card h2{
    margin:15px;
    text-align:center;
    font-size:20px;
    color:white;
}

a{
    text-decoration:none;
}

</style>
