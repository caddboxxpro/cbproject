.gallery{

    width:95%;

    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:20px;

}

.card{

    background:#303030;

    border-radius:10px;

    overflow:hidden;

    transition:.3s;

}

.card:hover{

    transform:scale(1.03);

}

.card img{

    width:100%;
    display:block;

}

.card h2{

    margin:15px;
