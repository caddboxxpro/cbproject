<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Kit NFT Creator</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;font-family:Arial,Helvetica,sans-serif;
    background:#eef3ee;color:#172017;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px
  }
  .app{
    width:min(1100px,100%);background:white;border-radius:18px;
    box-shadow:0 12px 40px #0002;overflow:hidden
  }
  header{padding:18px 24px;background:#172b1b;color:white}
  header h1{margin:0;font-size:24px}
  header p{margin:5px 0 0;opacity:.8}
  .content{display:grid;grid-template-columns:1fr 300px;gap:0}
  .art{padding:20px;background:#dfe9df}
  svg{display:block;width:100%;height:auto;border-radius:12px}
  .controls{padding:24px}
  .control{margin-bottom:20px}
  .control label{display:block;font-weight:bold;margin-bottom:8px}
  .pick{
    width:100%;height:52px;border:1px solid #ccc;border-radius:10px;
    padding:4px;background:white;cursor:pointer
  }
  .swatch{display:flex;align-items:center;gap:10px;margin-top:7px;color:#555;font-size:13px}
  button{
    width:100%;border:0;border-radius:10px;padding:13px 16px;
    background:#176b32;color:white;font-weight:bold;font-size:15px;cursor:pointer
  }
  button:hover{background:#125528}
  .secondary{background:#e9eee9;color:#172017;margin-top:10px}
  .secondary:hover{background:#dde5dd}
  @media(max-width:760px){.content{grid-template-columns:1fr}.controls{padding:20px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Football Kit NFT Creator</h1>
    <p>Choose the colours of the shirt, shorts and socks.</p>
  </header>

  <div class="content">
    <div class="art">
      <svg id="artwork" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg">
        <!-- sunny sky -->
        <rect width="800" height="900" fill="#78c9f2"/>
        <circle cx="665" cy="115" r="58" fill="#ffd94a"/>
        <g fill="#fff" opacity=".8">
          <ellipse cx="120" cy="130" rx="65" ry="24"/><ellipse cx="175" cy="125" rx="48" ry="20"/>
          <ellipse cx="440" cy="180" rx="65" ry="22"/><ellipse cx="500" cy="176" rx="45" ry="18"/>
        </g>
        <!-- distant pitch -->
        <path d="M0 470 Q400 420 800 470 L800 900 L0 900Z" fill="#38a852"/>
        <path d="M0 610 Q400 555 800 610" fill="none" stroke="#ffffff" stroke-width="5" opacity=".65"/>
        <ellipse cx="400" cy="700" rx="250" ry="90" fill="none" stroke="#ffffff" stroke-width="5" opacity=".7"/>
        <circle cx="400" cy="700" r="8" fill="#fff"/>

        <!-- shadow -->
        <ellipse cx="400" cy="815" rx="170" ry="28" fill="#176b32" opacity=".35"/>

        <!-- legs -->
        <path d="M350 675 L350 805 Q350 820 365 820 L390 820 Q400 820 398 805 L390 675Z" fill="#9b5f3d"/>
        <path d="M410 675 L410 805 Q410 820 425 820 L450 820 Q460 820 458 805 L450 675Z" fill="#9b5f3d"/>

        <!-- socks -->
        <path id="socks" d="M345 760 L397 760 L398 817 Q397 833 380 834 L355 834 Q342 831 345 815Z
                             M403 760 L455 760 L458 815 Q460 831 445 834 L420 834 Q403 833 403 817Z" fill="#ffffff"/>

        <!-- shoes -->
        <path d="M344 820 Q370 814 397 821 L430 840 Q435 850 425 856 L350 856 Q330 850 344 820Z" fill="#222"/>
        <path d="M403 821 Q430 814 457 821 L490 840 Q495 850 485 856 L410 856 Q390 850 403 821Z" fill="#222"/>

        <!-- shorts -->
        <path id="shorts" d="M315 560 L485 560 L470 700 L408 700 L400 650 L392 700 L330 700Z" fill="#ffffff"/>
        <path d="M400 575 L400 680" stroke="#ffffff" stroke-width="3" opacity=".5"/>

        <!-- shirt -->
        <path id="shirt" d="M320 355 Q350 330 375 325 L425 325 Q450 330 480 355
                             L535 400 L490 455 L455 425 L470 585
                             Q400 620 330 585 L345 425 L310 455 L265 400Z" fill="#e53935"/>
        <!-- shirt collar -->
        <path d="M375 327 Q400 350 425 327" fill="none" stroke="#fff" stroke-width="8"/>
        <!-- shirt number -->
        <text x="400" y="490" text-anchor="middle" font-size="75" font-weight="bold" fill="#fff">7</text>

        <!-- arms -->
        <path d="M275 402 Q250 455 265 515 Q270 532 286 525 L300 517 Q292 462 310 425Z" fill="#9b5f3d"/>
        <path d="M525 402 Q550 455 535 515 Q530 532 514 525 L500 517 Q508 462 490 425Z" fill="#9b5f3d"/>

        <!-- neck -->
        <path d="M375 310 L425 310 L425 345 Q400 360 375 345Z" fill="#9b5f3d"/>

        <!-- head -->
        <ellipse cx="400" cy="245" rx="92" ry="105" fill="#a96643"/>

        <!-- hair -->
        <path d="M315 245 Q305 135 400 125 Q495 135 485 245 Q465 205 445 190
                 Q410 220 365 185 Q345 220 315 245Z" fill="#4a2b1b"/>
        <!-- ears -->
        <ellipse cx="310" cy="260" rx="18" ry="25" fill="#a96643"/>
        <ellipse cx="490" cy="260" rx="18" ry="25" fill="#a96643"/>
        <!-- face -->
        <circle cx="368" cy="255" r="7" fill="#222"/>
        <circle cx="432" cy="255" r="7" fill="#222"/>
        <path d="M380 300 Q400 315 420 300" fill="none" stroke="#542f22" stroke-width="5" stroke-linecap="round"/>
        <path d="M400 260 L394 285 L407 287" fill="none" stroke="#7b4633" stroke-width="4"/>

        <!-- ball -->
        <circle cx="590" cy="770" r="52" fill="#fff"/>
        <path d="M590 735 l18 13 -7 22 h-22 l-7-22z" fill="#222"/>
        <path d="M590 735 L590 718 M608 748 L628 742 M601 770 L615 788 M579 770 L565 788 M572 748 L552 742" stroke="#222" stroke-width="4"/>
      </svg>
    </div>

    <aside class="controls">
      <div class="control">
        <label for="shirtColor">Shirt colour</label>
        <input id="shirtColor" class="pick" type="color" value="#e53935">
        <div class="swatch"><span id="shirtHex">#E53935</span></div>
      </div>

      <div class="control">
        <label for="shortsColor">Shorts colour</label>
        <input id="shortsColor" class="pick" type="color" value="#ffffff">
        <div class="swatch"><span id="shortsHex">#FFFFFF</span></div>
      </div>

      <div class="control">
        <label for="socksColor">Socks colour</label>
        <input id="socksColor" class="pick" type="color" value="#ffffff">
        <div class="swatch"><span id="socksHex">#FFFFFF</span></div>
      </div>

      <button id="download">Download Artwork PNG</button>
      <button id="reset" class="secondary">Reset colours</button>
    </aside>
  </div>
</div>

<script>
const controls = [
  ['shirtColor','shirt','shirtHex'],
  ['shortsColor','shorts','shortsHex'],
  ['socksColor','socks','socksHex']
];

controls.forEach(([inputId,partId,hexId]) => {
  const input=document.getElementById(inputId);
  const part=document.getElementById(partId);
  const hex=document.getElementById(hexId);
  input.addEventListener('input',()=>{
    part.setAttribute('fill',input.value);
    hex.textContent=input.value.toUpperCase();
  });
});

document.getElementById('reset').onclick=()=>{
  const defaults={shirtColor:'#e53935',shortsColor:'#ffffff',socksColor:'#ffffff'};
  controls.forEach(([inputId,partId,hexId])=>{
    const input=document.getElementById(inputId);
    input.value=defaults[inputId];
    document.getElementById(partId).setAttribute('fill',input.value);
    document.getElementById(hexId).textContent=input.value.toUpperCase();
  });
};

document.getElementById('download').onclick=()=>{
  const svg=document.getElementById('artwork');
  const clone=svg.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  clone.setAttribute('xmlns:xlink','http://www.w3.org/1999/xlink');

  const data=new XMLSerializer().serializeToString(clone);
  const svgBlob=new Blob([data],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(svgBlob);

  const img=new Image();
  img.onload=()=>{
    try {
      const canvas=document.createElement('canvas');
      canvas.width=1200;
      canvas.height=1350;
      const ctx=canvas.getContext('2d');

      // Draw a white background first so the PNG is never transparent.
      ctx.fillStyle='#ffffff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);

      URL.revokeObjectURL(url);

      canvas.toBlob((blob)=>{
        if(!blob){
          alert('The artwork could not be created. Please try again.');
          return;
        }
        const downloadUrl=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=downloadUrl;
        a.download='football-boy-nft.png';
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(()=>URL.revokeObjectURL(downloadUrl),1000);
      },'image/png');
    } catch(err) {
      URL.revokeObjectURL(url);
      alert('The artwork could not be downloaded. Please try again.');
      console.error(err);
    }
  };

  img.onerror=()=>{
    URL.revokeObjectURL(url);
    alert('The artwork could not be rendered. Please try again.');
  };

  img.src=url;
};
</script>
</body>
</html>
