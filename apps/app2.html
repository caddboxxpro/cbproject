<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Football Team NFT Creator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef3ee;
  color: #172017;
  min-height: 100vh;
  padding: 24px;
}

.app {
  width: min(1300px, 100%);
  margin: auto;
  background: white;
  border-radius: 18px;
  box-shadow: 0 12px 40px #0002;
  overflow: hidden;
}

/* HEADER */

header {
  padding: 18px 24px;
  background: #172b1b;
  color: white;
}

header h1 {
  margin: 0;
  font-size: 24px;
}

header p {
  margin: 5px 0 0;
  opacity: .8;
}

/* BANNER */

.banner {
  position: relative;
  width: 100%;
  height: 280px;
  background: #222;
  overflow: hidden;
}

#bannerImage {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.banner-placeholder {
  position: absolute;
  inset: 0;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  color: white;
  text-align: center;
}

.banner-placeholder h2 {
  margin: 0 0 8px;
  font-size: 30px;
}

.banner-placeholder p {
  margin: 0;
  opacity: .75;
}

.banner-upload {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);

  background: #176b32;
  color: white;

  border: 2px solid white;
  border-radius: 10px;

  padding: 12px 22px;

  font-weight: bold;
  cursor: pointer;

  z-index: 5;
}

.banner-upload:hover {
  background: white;
  color: #176b32;
}

#bannerUpload {
  display: none;
}

/* MAIN CONTENT */

.content {
  display: grid;
  grid-template-columns: 1fr 300px;
}

/* ART */

.art {
  padding: 20px;
  background: #dfe9df;
}

svg {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 12px;
}

/* CONTROLS */

.controls {
  padding: 24px;
}

.control {
  margin-bottom: 20px;
}

.control label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

select,
.pick {
  width: 100%;
  height: 52px;
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 4px;
  background: white;
  cursor: pointer;
}

.swatch {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 7px;
  color: #555;
  font-size: 13px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 10px;
  padding: 13px 16px;

  background: #176b32;
  color: white;

  font-weight: bold;
  font-size: 15px;

  cursor: pointer;
}

button:hover {
  background: #125528;
}

.secondary {
  background: #e9eee9;
  color: #172017;
  margin-top: 10px;
}

.secondary:hover {
  background: #dde5dd;
}

/* PLAYER INFORMATION */

.player-info {
  margin-bottom: 20px;
  padding: 12px;

  background: #eef3ee;
  border-radius: 10px;

  text-align: center;
  font-weight: bold;
}

/* MOBILE */

@media(max-width:900px) {

  .content {
    grid-template-columns: 1fr;
  }

  .controls {
    padding: 20px;
  }

}

@media(max-width:600px) {

  body {
    padding: 8px;
  }

  .banner {
    height: 210px;
  }

  .banner-placeholder h2 {
    font-size: 23px;
  }

  header h1 {
    font-size: 20px;
  }
}
</style>
</head>

</div>

</div>


<div class="control">

<label for="socksColor">
Socks colour
</label>

<input
  id="socksColor"
  class="pick"
  type="color"
  value="#ffffff"
>

<div class="swatch">
<span id="socksHex">#FFFFFF</span>
</div>

</div>


<button id="download">
Download Artwork PNG
</button>

<button id="reset" class="secondary">
Reset Selected Player
</button>

<button id="resetAll" class="secondary">
Reset All Players
</button>

</aside>

</div>

</div>


<script>

/* ========================================================= */
/* BANNER IMAGE UPLOAD */
/* ========================================================= */

const bannerUpload =
  document.getElementById("bannerUpload");

const bannerImage =
  document.getElementById("bannerImage");

const bannerPlaceholder =
  document.getElementById("bannerPlaceholder");


bannerUpload.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    alert("Please select an image file.");

    return;
  }

  const url = URL.createObjectURL(file);

  bannerImage.src = url;

  bannerImage.style.display = "block";

  bannerPlaceholder.style.display = "none";

});


/* ========================================================= */
/* PLAYER DATA */
/* ========================================================= */

const players = {};

for (let i = 1; i <= 11; i++) {

  players[i] = {

    shirt: "#e53935",
    shorts: "#ffffff",
    socks: "#ffffff"

  };

}


/* ========================================================= */
/* ELEMENTS */
/* ========================================================= */

const playerSelect =
  document.getElementById("playerSelect");

const playerInfo =
  document.getElementById("playerInfo");

const shirtColor =
  document.getElementById("shirtColor");

const shortsColor =
  document.getElementById("shortsColor");

const socksColor =
  document.getElementById("socksColor");

const shirtHex =
  document.getElementById("shirtHex");

const shortsHex =
  document.getElementById("shortsHex");

const socksHex =
  document.getElementById("socksHex");


/* ========================================================= */
/* UPDATE PLAYER CONTROLS */
/* ========================================================= */

function loadPlayer() {

  const number =
    playerSelect.value;

  const player =
    players[number];

  shirtColor.value =
    player.shirt;

  shortsColor.value =
    player.shorts;

  socksColor.value =
    player.socks;

  shirtHex.textContent =
    player.shirt.toUpperCase();

  shortsHex.textContent =
    player.shorts.toUpperCase();

  socksHex.textContent =
    player.socks.toUpperCase();

  if (number === "3") {

    playerInfo.textContent =
      "Editing Goalkeeper";

  } else {

    playerInfo.textContent =
      "Editing Player " + number;

  }

}


/* ========================================================= */
/* UPDATE SVG */
/* ========================================================= */

function updatePlayer() {

  const number =
    playerSelect.value;

  const player =
    players[number];


  document
    .querySelectorAll(".p" + number + "-shirt")
    .forEach(el => {

      el.setAttribute(
        "fill",
        player.shirt
      );

    });


  document
    .querySelectorAll(".p" + number + "-shorts")
    .forEach(el => {

      el.setAttribute(
        "fill",
        player.shorts
      );

    });


  document
    .querySelectorAll(".p" + number + "-socks")
    .forEach(el => {

      el.setAttribute(
        "fill",
        player.socks
      );

    });

}


/* ========================================================= */
/* PLAYER SELECTION */
/* ========================================================= */

playerSelect.addEventListener(
  "change",
  loadPlayer
);


/* ========================================================= */
/* SHIRT */
/* ========================================================= */

shirtColor.addEventListener(
  "input",
  function() {

    const number =
      playerSelect.value;

    players[number].shirt =
      this.value;

    shirtHex.textContent =
      this.value.toUpperCase();

    updatePlayer();

  }
);


/* ========================================================= */
/* SHORTS */
/* ========================================================= */

shortsColor.addEventListener(
  "input",
  function() {

    const number =
      playerSelect.value;

    players[number].shorts =
      this.value;

    shortsHex.textContent =
      this.value.toUpperCase();

    updatePlayer();

  }
);


/* ========================================================= */
/* SOCKS */
/* ========================================================= */

socksColor.addEventListener(
  "input",
  function() {

    const number =
      playerSelect.value;

    players[number].socks =
      this.value;

    socksHex.textContent =
      this.value.toUpperCase();

    updatePlayer();

  }
);


/* ========================================================= */
/* RESET SELECTED PLAYER */
/* ========================================================= */

document.getElementById("reset").onclick =
function() {

  const number =
    playerSelect.value;

  players[number] = {

    shirt: "#e53935",
    shorts: "#ffffff",
    socks: "#ffffff"

  };

  loadPlayer();

  updatePlayer();

};


/* ========================================================= */
/* RESET ALL PLAYERS */
/* ========================================================= */

document.getElementById("resetAll").onclick =
function() {

  for (let i = 1; i <= 11; i++) {

    players[i] = {

      shirt: "#e53935",
      shorts: "#ffffff",
      socks: "#ffffff"

    };

  }

  loadPlayer();

  for (let i = 1; i <= 11; i++) {

    document
      .querySelectorAll(".p" + i + "-shirt")
      .forEach(el =>
        el.setAttribute("fill", "#e53935")
      );

    document
      .querySelectorAll(".p" + i + "-shorts")
      .forEach(el =>
        el.setAttribute("fill", "#ffffff")
      );

    document
      .querySelectorAll(".p" + i + "-socks")
      .forEach(el =>
        el.setAttribute("fill", "#ffffff")
      );

  }

};


/* ========================================================= */
/* DOWNLOAD PNG */
/* ========================================================= */

document.getElementById("download").onclick =
function() {

  const svg =
    document.getElementById("artwork");

  const clone =
    svg.cloneNode(true);

  clone.setAttribute(
    "xmlns",
    "http://www.w3.org/2000/svg"
  );

  clone.setAttribute(
    "xmlns:xlink",
    "http://www.w3.org/1999/xlink"
  );


  const data =
    new XMLSerializer()
      .serializeToString(clone);


  const svgBlob =
    new Blob(
      [data],
      {
        type:
        "image/svg+xml;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(svgBlob);


  const img =
    new Image();


  img.onload =
  function() {

    try {

      const canvas =
        document.createElement("canvas");

      canvas.width = 1200;
      canvas.height = 1100;


      const ctx =
        canvas.getContext("2d");


      ctx.fillStyle =
        "#ffffff";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );


      URL.revokeObjectURL(url);


      canvas.toBlob(
        function(blob) {

          if (!blob) {

            alert(
              "The artwork could not be created."
            );

            return;
          }


          const downloadUrl =
            URL.createObjectURL(blob);


          const a =
            document.createElement("a");


          a.href =
            downloadUrl;

          a.download =
            "football-team-nft.png";


          document.body.appendChild(a);

          a.click();

          a.remove();


          setTimeout(
            () =>
              URL.revokeObjectURL(
                downloadUrl
              ),
            1000
          );

        },
        "image/png"
      );


    } catch (err) {

      URL.revokeObjectURL(url);

      alert(
        "The artwork could not be downloaded."
      );

      console.error(err);

    }

  };


  img.onerror =
  function() {

    URL.revokeObjectURL(url);

    alert(
      "The artwork could not be rendered."
    );

  };


  img.src = url;

};


/* ========================================================= */
/* INITIALISE */
/* ========================================================= */

loadPlayer();

updatePlayer();

</script>

</body>
</html>
