<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GLB Texture Test</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>

body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#controls {
    position: fixed;
    z-index: 10;
    top: 20px;
    left: 20px;

    background: white;
    padding: 15px;

    border-radius: 10px;
    box-shadow: 0 4px 20px #0004;
}

#controls input {
    margin-top: 8px;
}

</style>
</head>

<body>

<div id="controls">

    <strong>Upload Texture</strong><br>

    <input
        id="texture"
        type="file"
        accept="image/*"
    >

</div>


<a-scene>

    <a-entity
        camera
        position="0 1.5 4"
        look-controls
    ></a-entity>


    <a-light
        type="ambient"
        intensity="2"
    ></a-light>

    <a-light
        type="directional"
        intensity="2"
        position="-3 5 5"
    ></a-light>


    <!-- YOUR GLB -->

    <a-entity
        id="model"
        gltf-model="url(model.glb)"
        position="0 0 0"
        scale="1 1 1"
    ></a-entity>

</a-scene>


<script>

const model =
    document.getElementById("model");

document
.getElementById("texture")
.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;


    const imageURL =
        URL.createObjectURL(file);

    const image =
        new Image();


    image.onload = function () {

        /*
        Walk through the GLB.
        */

        model.object3D.traverse(
            function (object) {

                if (!object.isMesh)
                    return;


                /*
                Apply the texture to
                the block's material.
                */

                const material =
                    object.material;


                if (!material)
                    return;


                const texture =
                    new THREE.Texture(image);


                /*
                GLB textures normally
                use this orientation.
                */

                texture.flipY = false;

                texture.needsUpdate = true;


                /*
                Replace the existing
                surface texture.
                */

                material.map = texture;


                /*
                Don't tint the image.
                */

                material.color.set(
                    0xffffff
                );


                material.needsUpdate =
                    true;

            }
        );


        URL.revokeObjectURL(imageURL);

    };


    image.src = imageURL;

});

</script>

</body>
</html>
