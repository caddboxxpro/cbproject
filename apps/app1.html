html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}

#subMenus .subMenu{display:none}
#subMenus .subMenu button{background:var(--menu-color)}
#menuSelectors button,.subMenu button{width:78px;height:45px;padding:0;border:1px solid rgba(255,255,255,.8);border-radius:4px;color:#fff;font:bold 12px Arial,sans-serif;cursor:pointer}
#commandSets{position:fixed;left:0;right:0;top:10px;z-index:100000}
.commandSet{display:none;gap:5px;padding:0 10px;width:100%;box-sizing:border-box}

#externalLinks{position:fixed;right:10px;top:75px;z-index:100000;display:flex;flex-direction:column;gap:3px}
#externalLinks a{width:78px;height:45px;padding:0;border:1px solid rgba(255,255,255,.35);border-radius:4px;background:rgba(45,45,45,.72);color:#ddd;font:bold 12px Arial,sans-serif;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#externalLinks a:hover{background:rgba(65,65,65,.82)}
</style>

<script>
function hideAllSubMenus(){
  document.querySelectorAll('.subMenu').forEach(function(menu){ menu.style.display='none'; });
}

function showSubMenu(menuId){
  hideAllCommandSets();
  document.getElementById('menuSelectors').style.display='none';
  hideAllSubMenus();
  var menu=document.getElementById(menuId);
  menu.style.display='flex';

  // Carry the colour of the main button into the second level
  // and into whichever command set is subsequently displayed.
  var color=getComputedStyle(menu).getPropertyValue('--menu-color').trim();
  document.getElementById('commandSets').style.setProperty('--active-menu-color',color);
  document.querySelectorAll('.commandSet').forEach(function(set){
    set.style.setProperty('--menu-color',color);
  });
}

function hideAllCommandSets(){
  document.querySelectorAll('.commandSet').forEach(function(set){
    set.style.display='none';
  });
}

function showCommandSet(setId){
  hideAllCommandSets();
  document.getElementById('menuSelectors').style.display='none';
  hideAllSubMenus();
  document.getElementById(setId).style.display='flex';
}
