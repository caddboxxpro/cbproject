<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Area Colour Creator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
}

header {
    padding: 20px;
    background: #181818;
}

header h1 {
    margin: 0;
}

header p {
    margin: 6px 0 0;
    color: #aaa;
}

.app {
    display: grid;
    grid-template-columns: 1fr 300px;
    min-height: calc(100vh - 90px);
}

.viewer {
    padding: 20px;
    background: #333;
    display: flex;
    justify-content: center;
}

.viewer canvas {
    max-width: 100%;
    height: auto;
    display: block;
    background: white;
}

.controls {
    background: #f2f2f2;
    color: #222;
    padding: 20px;
}

.control {
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input[type="file"] {
    width: 100%;
}

input[type="range"] {
    width: 100%;
}

.value {
    font-size: 13px;
    color: #555;
    margin-top: 5px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: 0;
    border-radius: 7px;
    background: #176b32;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #125528;
}

button:disabled {
    opacity: .4;
    cursor: default;
}

.info {
    padding: 12px;
    border-radius: 7px;
    background: #ddd;
    font-size: 13px;
    line-height: 1.4;
}

#status {
    margin-top: 15px;
    color: #555;
    font-size: 13px;
    line-height: 1.4;
}

@media(max-width:800px) {
    .app {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>Area Colour Creator</h1>
    <p>Replace detected areas with new solid colours.</p>
</header>


<div class="app">

    <div class="viewer">
        <canvas id="canvas"></canvas>
    </div>


    <aside class="controls">

        <div class="control">

            <label>
                Upload image
            </label>

            <input
                id="file"
                type="file"
                accept="image/*"
            >

        </div>


        <div class="control">

            <label>
                Area sensitivity
            </label>

            <input
                id="tolerance"
                type="range"
                min="1"
                max="100"
                value="15"
            >

            <div class="value">
                <span id="toleranceValue">15</span>
            </div>

        </div>


        <button
            id="detect"
            disabled
        >
            DETECT AREAS
        </button>


        <button
            id="colour"
            disabled
        >
            COLOUR ALL AREAS
        </button>


        <div class="info">

            Each connected area receives
            one completely new solid colour.

            The original shading is not copied
            into the new colour.

        </div>


        <div id="status">
            Upload an image.

        </div>

    </aside>

</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );

const file =
    document.getElementById("file");

const tolerance =
    document.getElementById("tolerance");

const toleranceValue =
    document.getElementById("toleranceValue");

const detectButton =
    document.getElementById("detect");

const colourButton =
    document.getElementById("colour");

const status =
    document.getElementById("status");


let imageData = null;

let original = null;

let width = 0;

let height = 0;

let regions = [];


/* =====================================================
   TOLERANCE DISPLAY
===================================================== */

tolerance.addEventListener(
    "input",
    function() {

        toleranceValue.textContent =
            this.value;

    }
);


/* =====================================================
   LOAD IMAGE
===================================================== */

file.addEventListener(
    "change",
    function() {

        const selected =
            this.files[0];

        if (!selected) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                const img =
                    new Image();


                img.onload =
                    function() {

                        width =
                            img.naturalWidth;

                        height =
                            img.naturalHeight;


                        canvas.width =
                            width;

                        canvas.height =
                            height;


                        ctx.drawImage(
                            img,
                            0,
                            0,
                            width,
                            height
                        );


                        imageData =
                            ctx.getImageData(
                                0,
                                0,
                                width,
                                height
                            );


                        original =
                            new Uint8ClampedArray(
                                imageData.data
                            );


                        regions = [];


                        detectButton.disabled =
                            false;

                        colourButton.disabled =
                            true;


                        status.textContent =
                            "Image loaded.";

                    };


                img.src =
                    e.target.result;

            };


        reader.readAsDataURL(
            selected
        );

    }
);


/* =====================================================
   DETECT AREAS
===================================================== */

detectButton.addEventListener(
    "click",
    function() {

        if (!original) {
            return;
        }


        status.textContent =
            "Detecting areas...";


        setTimeout(
            detectAreas,
            30
        );

    }
);


/* =====================================================
   AREA DETECTION
===================================================== */

function detectAreas() {

    const total =
        width * height;


    const limit =
        Number(
            tolerance.value
        );


    /*
    Every pixel starts as
    unassigned.
    */

    const assigned =
        new Uint8Array(total);


    regions = [];


    /*
    Minimum area size.

    Small isolated pixels are
    ignored.
    */

    const minimumArea =
        Math.max(
            30,
            Math.floor(
                total * 0.00005
            )
        );


    /*
    Scan image from top-left
    to bottom-right.
    */

    for (
        let start = 0;
        start < total;
        start++
    ) {

        if (
            assigned[start]
        ) {
            continue;
        }


        const queue = [start];

        assigned[start] = 1;


        const pixels = [];


        let position = 0;


        while (
            position <
            queue.length
        ) {

            const index =
                queue[position++];


            pixels.push(index);


            const x =
                index % width;

            const y =
                Math.floor(
                    index / width
                );


            /*
            LEFT
            */

            if (x > 0) {

                testPixel(
                    index,
                    index - 1
                );

            }


            /*
            RIGHT
            */

            if (
                x < width - 1
            ) {

                testPixel(
                    index,
                    index + 1
                );

            }


            /*
            UP
            */

            if (y > 0) {

                testPixel(
                    index,
                    index - width
                );

            }


            /*
            DOWN
            */

            if (
                y < height - 1
            ) {

                testPixel(
                    index,
                    index + width
                );

            }

        }


        /*
        Only retain areas large
        enough to be useful.
        */

        if (
            pixels.length >=
            minimumArea
        ) {

            regions.push(
                pixels
            );

        }


        /*
        Compare two neighbouring
        pixels.
        */

        function testPixel(
            current,
            neighbour
        ) {

            if (
                assigned[neighbour]
            ) {
                return;
            }


            const a =
                current * 4;

            const b =
                neighbour * 4;


            const r =
                Math.abs(
                    original[a] -
                    original[b]
                );

            const g =
                Math.abs(
                    original[a + 1] -
                    original[b + 1]
                );

            const blue =
                Math.abs(
                    original[a + 2] -
                    original[b + 2]
                );


            /*
            Maximum channel difference.

            This is deliberately simple:
            pixels are joined when all
            three colour channels are
            reasonably similar.
            */

            if (
                r <= limit &&
                g <= limit &&
                blue <= limit
            ) {

                assigned[neighbour] =
                    1;

                queue.push(
                    neighbour
                );

            }

        }

    }


    /*
    Show detected regions with
    different temporary colours.

    This makes it immediately clear
    whether the segmentation is
    correct.
    */

    const output =
        new Uint8ClampedArray(
            original
        );


    regions.forEach(
        function(region, i) {

            const colour =
                makeColour(i);


            region.forEach(
                function(index) {

                    const p =
                        index * 4;


                    output[p] =
                        colour.r;

                    output[p + 1] =
                        colour.g;

                    output[p + 2] =
                        colour.b;

                }
            );

        }
    );


    ctx.putImageData(
        new ImageData(
            output,
            width,
            height
        ),
        0,
        0
    );


    colourButton.disabled =
        regions.length === 0;


    status.textContent =
        regions.length +
        " areas detected.";

}


/* =====================================================
   COLOUR ALL AREAS
===================================================== */

colourButton.addEventListener(
    "click",
    function() {

        if (
            regions.length === 0
        ) {
            return;
        }


        const output =
            new Uint8ClampedArray(
                original
            );


        /*
        Give every area a new
        random solid colour.
        */

        regions.forEach(
            function(region) {

                const colour =
                    randomColour();


                region.forEach(
                    function(index) {

                        const p =
                            index * 4;


                        output[p] =
                            colour.r;

                        output[p + 1] =
                            colour.g;

                        output[p + 2] =
                            colour.b;

                    }
                );

            }
        );


        ctx.putImageData(
            new ImageData(
                output,
                width,
                height
            ),
            0,
            0
        );


        status.textContent =
            regions.length +
            " areas coloured.";

    }
);


/* =====================================================
   RANDOM COLOUR
===================================================== */

function randomColour() {

    return {

        r:
            Math.floor(
                Math.random() * 256
            ),

        g:
            Math.floor(
                Math.random() * 256
            ),

        b:
            Math.floor(
                Math.random() * 256
            )

    };

}


/* =====================================================
   PREVIEW COLOURS
===================================================== */

function makeColour(number) {

    const hue =
        (
            number * 137.508
        ) % 360;


    return hsvToRgb(
        hue,
        0.8,
        0.9
    );

}


/* =====================================================
   HSV TO RGB
===================================================== */

function hsvToRgb(
    h,
    s,
    v
) {

    const c =
        v * s;

    const x =
        c *
        (
            1 -
            Math.abs(
                (h / 60) % 2 - 1
            )
        );

    const m =
        v - c;


    let r = 0;
    let g = 0;
    let b = 0;


    if (h < 60) {
        r = c;
        g = x;
    }

    else if (h < 120) {
        r = x;
        g = c;
    }

    else if (h < 180) {
        g = c;
        b = x;
    }

    else if (h < 240) {
        g = x;
        b = c;
    }

    else if (h < 300) {
        r = x;
        b = c;
    }

    else {
        r = c;
        b = x;
    }


    return {

        r:
            Math.round(
                (r + m) * 255
            ),

        g:
            Math.round(
                (g + m) * 255
            ),

        b:
            Math.round(
                (b + m) * 255
            )

    };

}

</script>

</body>
</html>
