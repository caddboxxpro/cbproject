<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Colour Area Collection Creator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
}

header {
    background: #181818;
    padding: 18px 24px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 6px 0 0;
    color: #aaa;
}

.app {
    display: grid;
    grid-template-columns: 1fr 300px;
    min-height: calc(100vh - 90px);
}

/* IMAGE */

.image-panel {
    background: #303030;
    padding: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.image-wrapper {
    position: relative;
    max-width: 800px;
    width: 100%;
}

#imageCanvas {
    display: block;
    width: 100%;
    height: auto;
    cursor: crosshair;
    background: #222;
}

/* CONTROLS */

.controls {
    background: #f4f4f4;
    color: #222;
    padding: 22px;
}

.control {
    margin-bottom: 22px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input[type="file"] {
    width: 100%;
}

input[type="color"] {
    width: 100%;
    height: 55px;
    padding: 3px;
    border: 1px solid #bbb;
    border-radius: 8px;
    cursor: pointer;
}

.selected {
    padding: 12px;
    background: #e5e5e5;
    border-radius: 8px;
    margin-bottom: 15px;
}

.selected strong {
    display: block;
    margin-bottom: 5px;
}

#selectedColour {
    display: inline-block;
    width: 25px;
    height: 25px;
    vertical-align: middle;
    border-radius: 4px;
    border: 1px solid #999;
}

button {
    width: 100%;
    border: 0;
    border-radius: 8px;
    padding: 13px;
    margin-top: 8px;

    background: #176b32;
    color: white;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #125528;
}

.secondary {
    background: #ddd;
    color: #222;
}

.secondary:hover {
    background: #ccc;
}

#areas {
    margin-top: 20px;
}

.area {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 8px;
    margin-bottom: 6px;

    background: #e5e5e5;
    border-radius: 6px;

    font-size: 13px;
}

.area-colour {
    width: 25px;
    height: 25px;
    border-radius: 4px;
    border: 1px solid #999;
}

.area-name {
    flex: 1;
}

#status {
    margin-top: 15px;
    font-size: 13px;
    color: #555;
}

/* COLLECTION */

#collection {
    grid-column: 1 / -1;

    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 18px;

    padding: 25px;

    background: #111;
}

.card {
    background: #222;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
}

.card canvas {
    width: 100%;
    display: block;
    border-radius: 6px;
}

.card h3 {
    margin: 10px 0;
}

.card button {
    width: 100%;
}

/* RESPONSIVE */

@media(max-width: 850px) {

    .app {
        grid-template-columns: 1fr;
    }

    #collection {
        grid-template-columns: repeat(3, 1fr);
    }

}

@media(max-width: 600px) {

    #collection {
        grid-template-columns: repeat(2, 1fr);
        padding: 10px;
    }

}

</style>
</head>

<body>

<header>

    <h1>Colour Area Collection Creator</h1>

    <p>
        Upload an image, click an area, then give that area a new colour.
    </p>

</header>


<div class="app">

    <!-- IMAGE -->

    <div class="image-panel">

        <div class="image-wrapper">

            <canvas id="imageCanvas"></canvas>

        </div>

    </div>


    <!-- CONTROLS -->

    <aside class="controls">

        <div class="control">

            <label>
                1. Upload image
            </label>

            <input
                id="upload"
                type="file"
                accept="image/*"
            >

        </div>


        <div class="selected">

            <strong>
                Selected area
            </strong>

            <span id="areaName">
                None
            </span>

            <br><br>

            Original colour:

            <span id="selectedColour"></span>

        </div>


        <div class="control">

            <label>
                2. Choose new colour
            </label>

            <input
                id="colourPicker"
                type="color"
                value="#ff0000"
            >

        </div>


        <button id="applyColour">
            APPLY COLOUR TO AREA
        </button>


        <button
            id="reset"
            class="secondary"
        >
            RESET IMAGE
        </button>


        <div id="areas">

            <strong>
                Defined Areas
            </strong>

        </div>


        <button id="create">
            CREATE 10 VARIATIONS
        </button>


        <div id="status">
            Upload an image to begin.
        </div>

    </aside>

</div>


<!-- COLLECTION -->

<div id="collection"></div>


<script>

/*
========================================================
VARIABLES
========================================================
*/

const canvas =
    document.getElementById("imageCanvas");

const ctx =
    canvas.getContext("2d", {
        willReadFrequently: true
    });

const upload =
    document.getElementById("upload");

const colourPicker =
    document.getElementById("colourPicker");

const applyColour =
    document.getElementById("applyColour");

const reset =
    document.getElementById("reset");

const create =
    document.getElementById("create");

const areaName =
    document.getElementById("areaName");

const selectedColour =
    document.getElementById("selectedColour");

const areasContainer =
    document.getElementById("areas");

const status =
    document.getElementById("status");

const collection =
    document.getElementById("collection");


let image = null;

let originalPixels = null;

let selectedArea = null;

let areas = [];


/*
========================================================
UPLOAD
========================================================
*/

upload.addEventListener(
    "change",
    function () {

        const file =
            this.files[0];

        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function (event) {

                image =
                    new Image();


                image.onload =
                    function () {

                        canvas.width =
                            image.width;

                        canvas.height =
                            image.height;


                        ctx.drawImage(
                            image,
                            0,
                            0
                        );


                        const imageData =
                            ctx.getImageData(
                                0,
                                0,
                                canvas.width,
                                canvas.height
                            );


                        originalPixels =
                            new Uint8ClampedArray(
                                imageData.data
                            );


                        areas = [];

                        selectedArea =
                            null;


                        updateAreaDisplay();


                        status.textContent =
                            "Click an area of the image.";

                        areaName.textContent =
                            "None";

                        selectedColour.style.background =
                            "transparent";


                        collection.innerHTML =
                            "";

                    };


                image.src =
                    event.target.result;

            };


        reader.readAsDataURL(file);

    }
);


/*
========================================================
CLICK IMAGE
========================================================

The colour underneath the mouse becomes
the selected AREA.

========================================================
*/

canvas.addEventListener(
    "click",
    function (event) {

        if (!image) {
            return;
        }


        /*
        Convert screen coordinates to
        actual image coordinates.
        */

        const rect =
            canvas.getBoundingClientRect();


        const scaleX =
            canvas.width / rect.width;

        const scaleY =
            canvas.height / rect.height;


        const x =
            Math.floor(
                (event.clientX - rect.left)
                * scaleX
            );


        const y =
            Math.floor(
                (event.clientY - rect.top)
                * scaleY
            );


        const pixel =
            ctx.getImageData(
                x,
                y,
                1,
                1
            ).data;


        const r =
            pixel[0];

        const g =
            pixel[1];

        const b =
            pixel[2];


        /*
        Look for an existing area
        with approximately the same
        original colour.
        */

        let existing =
            findArea(r, g, b);


        if (!existing) {

            existing = {

                name:
                    "Area " +
                    String.fromCharCode(
                        65 + areas.length
                    ),

                r: r,
                g: g,
                b: b,

                newColour:
                    rgbToHex(
                        r,
                        g,
                        b
                    )

            };


            areas.push(existing);

        }


        selectedArea =
            existing;


        areaName.textContent =
            existing.name;


        selectedColour.style.background =
            rgbToHex(
                existing.r,
                existing.g,
                existing.b
            );


        colourPicker.value =
            existing.newColour;


        status.textContent =
            existing.name +
            " selected.";


        updateAreaDisplay();

    }
);


/*
========================================================
FIND AREA
========================================================
*/

function findArea(r, g, b) {

    const tolerance =
        15;


    for (
        const area of areas
    ) {

        const distance =
            Math.sqrt(

                Math.pow(
                    r - area.r,
                    2
                )

                +

                Math.pow(
                    g - area.g,
                    2
                )

                +

                Math.pow(
                    b - area.b,
                    2
                )

            );


        if (
            distance <= tolerance
        ) {

            return area;

        }

    }


    return null;

}


/*
========================================================
APPLY COLOUR
========================================================
*/

applyColour.addEventListener(
    "click",
    function () {

        if (!selectedArea) {

            alert(
                "Click an area of the image first."
            );

            return;

        }


        selectedArea.newColour =
            colourPicker.value;


        /*
        Rebuild the image from the
        original pixels so that colours
        don't become mixed together.
        */

        redrawImage();


        status.textContent =
            selectedArea.name +
            " changed to " +
            colourPicker.value.toUpperCase();


        updateAreaDisplay();

    }
);


/*
========================================================
REDRAW IMAGE
========================================================
*/

function redrawImage() {

    if (!originalPixels) {
        return;
    }


    const data =
        new Uint8ClampedArray(
            originalPixels
        );


    /*
    Every pixel is compared against
    the ORIGINAL area colours.
    */

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];

        const g =
            data[i + 1];

        const b =
            data[i + 2];


        let matchedArea =
            null;


        for (
            const area of areas
        ) {

            const distance =
                Math.sqrt(

                    Math.pow(
                        r - area.r,
                        2
                    )

                    +

                    Math.pow(
                        g - area.g,
                        2
                    )

                    +

                    Math.pow(
                        b - area.b,
                        2
                    )

                );


            if (
                distance <= 15
            ) {

                matchedArea =
                    area;

                break;

            }

        }


        if (matchedArea) {

            const rgb =
                hexToRGB(
                    matchedArea.newColour
                );


            data[i] =
                rgb.r;

            data[i + 1] =
                rgb.g;

            data[i + 2] =
                rgb.b;

        }

    }


    const imageData =
        new ImageData(
            data,
            canvas.width,
            canvas.height
        );


    ctx.putImageData(
        imageData,
        0,
        0
    );

}


/*
========================================================
RESET
========================================================
*/

reset.addEventListener(
    "click",
    function () {

        if (!originalPixels) {
            return;
        }


        areas.forEach(
            function(area) {

                area.newColour =
                    rgbToHex(
                        area.r,
                        area.g,
                        area.b
                    );

            }
        );


        const imageData =
            new ImageData(
                new Uint8ClampedArray(
                    originalPixels
                ),
                canvas.width,
                canvas.height
            );


        ctx.putImageData(
            imageData,
            0,
            0
        );


        selectedArea =
            null;


        areaName.textContent =
            "None";


        selectedColour.style.background =
            "transparent";


        updateAreaDisplay();


        status.textContent =
            "Image reset.";

    }
);


/*
========================================================
DISPLAY AREAS
========================================================
*/

function updateAreaDisplay() {

    /*
    Remove everything except heading.
    */

    areasContainer.innerHTML =
        "<strong>Defined Areas</strong>";


    areas.forEach(
        function(area) {

            const div =
                document.createElement("div");

            div.className =
                "area";


            const colour =
                document.createElement("span");

            colour.className =
                "area-colour";


            colour.style.background =
                area.newColour;


            const name =
                document.createElement("span");

            name.className =
                "area-name";

            name.textContent =
                area.name;


            div.appendChild(
                colour
            );

            div.appendChild(
                name
            );


            areasContainer.appendChild(
                div
            );

        }
    );

}


/*
========================================================
CREATE 10 VARIATIONS
========================================================
*/

create.addEventListener(
    "click",
    function () {

        if (!originalPixels) {

            alert(
                "Upload an image first."
            );

            return;

        }


        if (areas.length === 0) {

            alert(
                "Click at least one area of the image first."
            );

            return;

        }


        createVariations();

    }
);


/*
========================================================
10 VARIATIONS
========================================================
*/

function createVariations() {

    collection.innerHTML =
        "";


    /*
    These are simply ten colour
    palettes.

    Area A always represents
    the same original area.

    Area B always represents
    the same original area.

    etc.
    */

    const palettes = [

        [
            "#E53935",
            "#FFFFFF",
            "#111111",
            "#1976D2",
            "#FDD835",
            "#43A047",
            "#8E24AA",
            "#FB8C00"
        ],

        [
            "#1976D2",
            "#E53935",
            "#FFFFFF",
            "#111111",
            "#43A047",
            "#FDD835",
            "#FB8C00",
            "#8E24AA"
        ],

        [
            "#43A047",
            "#FDD835",
            "#1976D2",
            "#E53935",
            "#FFFFFF",
            "#8E24AA",
            "#111111",
            "#FB8C00"
        ],

        [
            "#8E24AA",
            "#FB8C00",
            "#E53935",
            "#43A047",
            "#1976D2",
            "#FFFFFF",
            "#FDD835",
            "#111111"
        ],

        [
            "#FB8C00",
            "#1976D2",
            "#FDD835",
            "#8E24AA",
            "#E53935",
            "#43A047",
            "#FFFFFF",
            "#111111"
        ],

        [
            "#111111",
            "#E53935",
            "#1976D2",
            "#FFFFFF",
            "#FDD835",
            "#8E24AA",
            "#43A047",
            "#FB8C00"
        ],

        [
            "#D81B60",
            "#00897B",
            "#FDD835",
            "#5E35B1",
            "#E53935",
            "#1E88E5",
            "#43A047",
            "#111111"
        ],

        [
            "#00ACC1",
            "#8E24AA",
            "#E53935",
            "#FDD835",
            "#43A047",
            "#1976D2",
            "#FB8C00",
            "#111111"
        ],

        [
            "#6D4C41",
            "#E53935",
            "#43A047",
            "#1976D2",
            "#FDD835",
            "#8E24AA",
            "#FFFFFF",
            "#FB8C00"
        ],

        [
            "#263238",
            "#FFFFFF",
            "#E53935",
            "#1976D2",
            "#43A047",
            "#FDD835",
            "#8E24AA",
            "#FB8C00"
        ]

    ];


    for (
        let variation = 0;
        variation < 10;
        variation++
    ) {

        const newCanvas =
            document.createElement(
                "canvas"
            );


        newCanvas.width =
            canvas.width;

        newCanvas.height =
            canvas.height;


        const newCtx =
            newCanvas.getContext("2d");


        const data =
            new Uint8ClampedArray(
                originalPixels
            );


        /*
        Recolour the original areas.
        */

        for (
            let i = 0;
            i < data.length;
            i += 4
        ) {

            const r =
                data[i];

            const g =
                data[i + 1];

            const b =
                data[i + 2];


            let matchedArea =
                null;

            let closestDistance =
                Infinity;


            areas.forEach(
                function(area) {

                    const distance =
                        Math.sqrt(

                            Math.pow(
                                r - area.r,
                                2
                            )

                            +

                            Math.pow(
                                g - area.g,
                                2
                            )

                            +

                            Math.pow(
                                b - area.b,
                                2
                            )

                        );


                    if (
                        distance < closestDistance
                    ) {

                        closestDistance =
                            distance;

                        matchedArea =
                            area;

                    }

                }
            );


            if (
                matchedArea &&
                closestDistance <= 15
            ) {

                const areaIndex =
                    areas.indexOf(
                        matchedArea
                    );


                const colour =
                    palettes[variation]
                    [
                        areaIndex %
                        palettes[variation].length
                    ];


                const rgb =
                    hexToRGB(
                        colour
                    );


                data[i] =
                    rgb.r;

                data[i + 1] =
                    rgb.g;

                data[i + 2] =
                    rgb.b;

            }

        }


        newCtx.putImageData(
            new ImageData(
                data,
                canvas.width,
                canvas.height
            ),
            0,
            0
        );


        /*
        CARD
        */

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "card";


        const title =
            document.createElement(
                "h3"
            );

        title.textContent =
            "Collection " +
            String(
                variation + 1
            ).padStart(
                2,
                "0"
            );


        const download =
            document.createElement(
                "button"
            );

        download.textContent =
            "DOWNLOAD PNG";


        download.onclick =
            function() {

                newCanvas.toBlob(
                    function(blob) {

                        if (!blob) {

                            alert(
                                "Could not create PNG."
                            );

                            return;

                        }


                        const url =
                            URL.createObjectURL(
                                blob
                            );


                        const link =
                            document.createElement(
                                "a"
                            );


                        link.href =
                            url;


                        link.download =
                            "collection-" +
                            String(
                                variation + 1
                            ).padStart(
                                2,
                                "0"
                            ) +
                            ".png";


                        document.body.appendChild(
                            link
                        );


                        link.click();


                        document.body.removeChild(
                            link
                        );


                        setTimeout(
                            function() {

                                URL.revokeObjectURL(
                                    url
                                );

                            },
                            1000
                        );

                    },
                    "image/png"
                );

            };


        card.appendChild(
            newCanvas
        );

        card.appendChild(
            title
        );

        card.appendChild(
            download
        );


        collection.appendChild(
            card
        );

    }


    status.textContent =
        "10 variations created.";

}


/*
========================================================
RGB TO HEX
========================================================
*/

function rgbToHex(r, g, b) {

    return "#" +

        [r, g, b]
        .map(
            function(value) {

                return value
                    .toString(16)
                    .padStart(
                        2,
                        "0"
                    );

            }
        )
        .join("");

}


/*
========================================================
HEX TO RGB
========================================================
*/

function hexToRGB(hex) {

    hex =
        hex.replace(
            "#",
            ""
        );


    return {

        r:
            parseInt(
                hex.substring(
                    0,
                    2
                ),
                16
            ),

        g:
            parseInt(
                hex.substring(
                    2,
                    4
                ),
                16
            ),

        b:
            parseInt(
                hex.substring(
                    4,
                    6
                ),
                16
            )

    };

}

</script>

</body>
</html>
