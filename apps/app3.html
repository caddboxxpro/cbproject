```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Football Player</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
    }

    #controls {
        position: fixed;
        top: 15px;
        right: 15px;
        z-index: 10;

        width: 220px;
        padding: 18px;

        background: rgba(255,255,255,0.95);
        border-radius: 12px;

        box-shadow: 0 5px 20px #0005;
    }

    #controls h2 {
        margin: 0 0 15px;
        font-size: 20px;
    }

    .control {
        margin-bottom: 15px;
    }

    .control label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
    }

    input[type="color"] {
        width: 100%;
        height: 45px;
        border: 1px solid #ccc;
        border-radius: 6px;
        cursor: pointer;
    }

    button {
        width: 100%;
        padding: 10px;

        border: 0;
        border-radius: 7px;

        background: #176b32;
        color: white;

        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #125528;
    }
</style>
</head>

<body>


<div id="controls">

    <h2>Football Player</h2>

    <div class="control">

        <label for="skin">
            Skin colour
        </label>

        <input
            id="skin"
            type="color"
            value="#a96643"
        >

    </div>


    <div class="control">

        <label for="kit">
            Kit colour
        </label>

        <input
            id="kit"
            type="color"
            value="#e30613"
        >

    </div>


    <button id="reset">
        Reset
    </button>

</div>


<a-scene
    renderer="colorManagement: true; physicallyCorrectLights: true"
    background="color: #79c9f2"
>


    <!-- ================================================= -->
    <!-- CAMERA -->
    <!-- ================================================= -->

    <a-entity
        camera
        position="0 3 8"
        look-controls
    ></a-entity>


    <!-- ================================================= -->
    <!-- LIGHTING -->
    <!-- ================================================= -->

    <a-light
        type="ambient"
        intensity="1.5"
    ></a-light>

    <a-light
        type="directional"
        intensity="2"
        position="-10 15 10"
    ></a-light>


    <!-- ================================================= -->
    <!-- SKY -->
    <!-- ================================================= -->

    <a-sky
        color="#79c9f2"
    ></a-sky>


    <!-- ================================================= -->
    <!-- FOOTBALL PITCH -->
    <!-- ================================================= -->

    <a-plane
        rotation="-90 0 0"
        width="110"
        height="150"
        color="#249447"
    ></a-plane>


    <!-- ================================================= -->
    <!-- CENTRE CIRCLE -->
    <!-- ================================================= -->

    <a-ring
        position="0 0.03 0"
        rotation="-90 0 0"
        radius-inner="9"
        radius-outer="9.12"
        color="white"
    ></a-ring>


    <!-- CENTRE SPOT -->

    <a-cylinder
        position="0 0.04 0"
        radius="0.25"
        height="0.02"
        color="white"
    ></a-cylinder>


    <!-- ================================================= -->
    <!-- STADIUM -->
    <!-- ================================================= -->

    <a-box
        position="0 8 -45"
        width="110"
        height="16"
        depth="8"
        color="#444"
    ></a-box>

    <a-box
        position="-55 8 0"
        width="8"
        height="16"
        depth="90"
        color="#444"
    ></a-box>

    <a-box
        position="55 8 0"
        width="8"
        height="16"
        depth="90"
        color="#444"
    ></a-box>

    <a-box
        position="0 8 45"
        width="110"
        height="16"
        depth="8"
        color="#444"
    ></a-box>


    <!-- ================================================= -->
    <!-- PLAYER -->
    <!-- ================================================= -->

    <a-entity
        id="player"
        gltf-model="url(player.glb)"
        position="0 0 0"
        rotation="0 180 0"
        scale="1 1 1"
    ></a-entity>


</a-scene>


<script>

/* ===================================================== */
/* PLAYER */
/* ===================================================== */

const player =
    document.getElementById("player");


/* ===================================================== */
/* CHANGE MATERIAL COLOUR */
/* ===================================================== */

function changePlayerColour(type, colour) {

    if (!player.object3D) {
        return;
    }

    player.object3D.traverse(function(object) {

        if (!object.isMesh) {
            return;
        }

        const name =
            (
                object.name +
                " " +
                (
                    object.material &&
                    object.material.name
                    ? object.material.name
                    : ""
                )
            ).toLowerCase();


        /* SKIN */

        if (
            type === "skin" &&
            (
                name.includes("skin") ||
                name.includes("body") ||
                name.includes("face")
            )
        ) {

            if (object.material) {
                object.material.color.set(colour);
            }

        }


        /* KIT */

        if (
            type === "kit" &&
            (
                name.includes("shirt") ||
                name.includes("jersey") ||
                name.includes("kit") ||
                name.includes("short") ||
                name.includes("sock")
            )
        ) {

            if (object.material) {
                object.material.color.set(colour);
            }

        }

    });

}


/* ===================================================== */
/* SKIN COLOUR */
/* ===================================================== */

document
.getElementById("skin")
.addEventListener("input", function() {

    changePlayerColour(
        "skin",
        this.value
    );

});


/* ===================================================== */
/* KIT COLOUR */
/* ===================================================== */

document
.getElementById("kit")
.addEventListener("input", function() {

    changePlayerColour(
        "kit",
        this.value
    );

});


/* ===================================================== */
/* RESET */
/* ===================================================== */

document
.getElementById("reset")
.addEventListener("click", function() {

    document
    .getElementById("skin")
    .value = "#a96643";

    document
    .getElementById("kit")
    .value = "#e30613";

    changePlayerColour(
        "skin",
        "#a96643"
    );

    changePlayerColour(
        "kit",
        "#e30613"
    );

});


/* ===================================================== */
/* PLAYER LOADED */
/* ===================================================== */

player.addEventListener(
    "model-loaded",
    function() {

        console.log(
            "Football player GLB loaded"
        );

    }
);


player.addEventListener(
    "model-error",
    function() {

        console.error(
            "Could not load player.glb"
        );

    }
);

</script>

</body>
</html>
```
