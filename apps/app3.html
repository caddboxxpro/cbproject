<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flatten Image Areas</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
}

header {
    padding: 20px 25px;
    background: #1b1b1b;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 6px 0 0;
    color: #aaa;
}

.main {
    display: grid;
    grid-template-columns: 1fr 280px;
    min-height: calc(100vh - 90px);
}

.viewer {
    padding: 25px;
    background: #303030;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.viewer-inner {
    width: 100%;
    max-width: 900px;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
}

.controls {
    background: #f2f2f2;
    color: #222;
    padding: 22px;
}

.control {
    margin-bottom: 22px;
}

    display: block;

}

}

}

    width: 100%;
    padding: 13px;

}

</style>
</head>

<body>

<header>
    <h1>Flatten Image Areas</h1>
    <p>Detect the areas of an image and remove their shading.</p>
</header>


<div class="main">

    <div class="viewer">

        <div class="viewer-inner">

            <canvas id="canvas"></canvas>

        </div>

    </div>


    <aside class="controls">

        <div class="control">

            <label>
                Upload image
            </label>

            <input
                id="file"
                type="file"
                accept="image/*"
            >

        </div>


        <div class="control">

            <label>
                Colour tolerance
            </label>

            <input
                id="tolerance"
                type="range"
                min="5"
                max="80"
                value="25"
            >

            <div class="value">
                Tolerance:
                <span id="toleranceValue">
                    25
                </span>
            </div>

        </div>


        <div class="control">

            <button
                id="detect"
                disabled
            >
                DETECT & FLATTEN AREAS
            </button>

        </div>


        <div class="info">

            The image is divided into connected
            colour areas. Each area is then given
            one flat colour and a boundary is drawn
            around it.

        </div>


        <div id="status">
            Upload an image to begin.
        </div>

    </aside>

</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );

const fileInput =
    document.getElementById("file");

const toleranceInput =
    document.getElementById("tolerance");

const toleranceValue =
    document.getElementById("toleranceValue");

const detectButton =
    document.getElementById("detect");

const status =
    document.getElementById("status");


let originalPixels = null;

let width = 0;

let height = 0;


/* =====================================================
   TOLERANCE DISPLAY
===================================================== */

toleranceInput.addEventListener(
    "input",
    function() {

        toleranceValue.textContent =
            this.value;

    }
);


/* =====================================================
   LOAD IMAGE
===================================================== */

fileInput.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];

        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                const image =
                    new Image();


                image.onload =
                    function() {

                        width =
                            image.naturalWidth;

                        height =
                            image.naturalHeight;


                        canvas.width =
                            width;

                        canvas.height =
                            height;


                        ctx.drawImage(
                            image,
                            0,
                            0,
                            width,
                            height
                        );


                        const data =
                            ctx.getImageData(
                                0,
                                0,
                                width,
                                height
                            );


                        originalPixels =
                            new Uint8ClampedArray(
                                data.data
                            );


                        detectButton.disabled =
                            false;


                        status.textContent =
                            "Image loaded. Press DETECT & FLATTEN AREAS.";

                    };


                image.src =
                    event.target.result;

            };


        reader.readAsDataURL(file);

    }
);


/* =====================================================
   DETECT
===================================================== */

detectButton.addEventListener(
    "click",
    function() {

        if (!originalPixels) {
            return;
        }


        status.textContent =
            "Detecting areas...";


        /*
        Allow the browser to update the
        status before processing.
        */

        setTimeout(
            processImage,
            50
        );

    }
);


/* =====================================================
   PROCESS IMAGE
===================================================== */

function processImage() {

    const total =
        width * height;


    const tolerance =
        Number(
            toleranceInput.value
        );


    /*
    Each pixel stores its region ID.

    -1 means not processed.
    */

    const regionMap =
        new Int32Array(total);

    regionMap.fill(-1);


    const regions = [];


    /*
    Examine every pixel.
    */

    for (
        let start = 0;
        start < total;
        start++
    ) {

        if (
            regionMap[start] !== -1
        ) {
            continue;
        }


        const regionId =
            regions.length;


        const pixels = [];

        const queue = [start];

        let queuePosition = 0;


        regionMap[start] =
            regionId;


        /*
        Flood-fill this connected
        colour region.
        */

        while (
            queuePosition <
            queue.length
        ) {

            const index =
                queue[
                    queuePosition++
                ];


            pixels.push(index);


            const x =
                index % width;

            const y =
                Math.floor(
                    index / width
                );


            check(
                x - 1,
                y,
                index
            );

            check(
                x + 1,
                y,
                index
            );

            check(
                x,
                y - 1,
                index
            );

            check(
                x,
                y + 1,
                index
            );

        }


        /*
        Store region.
        */

        regions.push({
            pixels: pixels
        });


        /*
        Check neighbouring pixel.
        */

        function check(
            nx,
            ny,
            currentIndex
        ) {

            if (
                nx < 0 ||
                nx >= width ||
                ny < 0 ||
                ny >= height
            ) {
                return;
            }


            const neighbour =
                ny * width + nx;


            if (
                regionMap[neighbour] !== -1
            ) {
                return;
            }


            const a =
                currentIndex * 4;

            const b =
                neighbour * 4;


            const dr =
                originalPixels[a] -
                originalPixels[b];

            const dg =
                originalPixels[a + 1] -
                originalPixels[b + 1];

            const db =
                originalPixels[a + 2] -
                originalPixels[b + 2];


            const distance =
                Math.sqrt(
                    dr * dr +
                    dg * dg +
                    db * db
                );


            if (
                distance <= tolerance
            ) {

                regionMap[neighbour] =
                    regionId;

                queue.push(
                    neighbour
                );

            }

        }

    }


    /*
    Remove tiny regions.

    These are normally noise,
    isolated pixels, or tiny details.
    */

    const minimumPixels =
        Math.max(
            20,
            Math.floor(
                total * 0.0001
            )
        );


    const usableRegions =
        regions.filter(
            region =>
                region.pixels.length >=
                minimumPixels
        );


    /*
    Create output starting with
    the original image.

    Only detected regions are
    flattened.
    */

    const output =
        new Uint8ClampedArray(
            originalPixels
        );


    /*
    Flatten every region.

    The average colour of the
    region is calculated.

    Every pixel in that region
    receives EXACTLY that colour.
    */

    usableRegions.forEach(
        function(region) {

            let red = 0;

            let green = 0;

            let blue = 0;


            region.pixels.forEach(
                function(index) {

                    const p =
                        index * 4;


                    red +=
                        originalPixels[p];

                    green +=
                        originalPixels[p + 1];

                    blue +=
                        originalPixels[p + 2];

                }
            );


            const count =
                region.pixels.length;


            red =
                Math.round(
                    red / count
                );

            green =
                Math.round(
                    green / count
                );

            blue =
                Math.round(
                    blue / count
                );


            /*
            Apply flat colour.
            */

            region.pixels.forEach(
                function(index) {

                    const p =
                        index * 4;


                    output[p] =
                        red;

                    output[p + 1] =
                        green;

                    output[p + 2] =
                        blue;

                }
            );

        }
    );


    /*
    Draw boundaries.

    A pixel is a boundary pixel if
    one of its neighbours belongs
    to a different region.
    */

    usableRegions.forEach(
        function(region) {

            region.pixels.forEach(
                function(index) {

                    const x =
                        index % width;

                    const y =
                        Math.floor(
                            index / width
                        );


                    let boundary =
                        false;


                    if (
                        x === 0 ||
                        regionMap[index - 1] !==
                        regionMap[index]
                    ) {

                        boundary = true;

                    }


                    if (
                        x === width - 1 ||
                        regionMap[index + 1] !==
                        regionMap[index]
                    ) {

                        boundary = true;

                    }


                    if (
                        y === 0 ||
                        regionMap[index - width] !==
                        regionMap[index]
                    ) {

                        boundary = true;

                    }


                    if (
                        y === height - 1 ||
                        regionMap[index + width] !==
                        regionMap[index]
                    ) {

                        boundary = true;

                    }


                    if (boundary) {

                        const p =
                            index * 4;


                        /*
                        Black boundary.
                        */

                        output[p] = 0;

                        output[p + 1] = 0;

                        output[p + 2] = 0;

                    }

                }
            );

        }
    );


    /*
    Display result.
    */

    ctx.putImageData(
        new ImageData(
            output,
            width,
            height
        ),
        0,
        0
    );


    status.textContent =
        usableRegions.length +
        " areas detected, flattened and outlined.";

}

</script>

</body>
</html>
