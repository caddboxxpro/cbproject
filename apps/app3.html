<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area Colour Collection Creator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: #fff;
}

header {
    padding: 20px 24px;
    background: #181818;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 6px 0 0;
    color: #aaa;
}

.app {
    display: grid;
    grid-template-columns: 1fr 300px;
    min-height: calc(100vh - 90px);
}

.viewer {
    padding: 25px;
    background: #303030;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.viewer-inner {
    width: 100%;
    max-width: 900px;
}

canvas {
    width: 100%;
    height: auto;
    display: block;
    background: #222;
}

.controls {
    background: #f3f3f3;
    color: #222;
    padding: 22px;
}

.section {
    margin-bottom: 22px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input[type="file"] {
    width: 100%;
}

input[type="number"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #bbb;
    border-radius: 6px;
}

button {
    width: 100%;
    border: 0;
    border-radius: 7px;
    padding: 13px;
    margin-top: 8px;
    background: #176b32;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #125528;
}

button.secondary {
    background: #ddd;
    color: #222;
}

button.secondary:hover {
    background: #ccc;
}

button:disabled {
    opacity: .45;
    cursor: default;
}

.info {
    padding: 12px;
    background: #e5e5e5;
    border-radius: 7px;
    font-size: 13px;
    line-height: 1.45;
}

#status {
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.4;
    color: #555;
}

#collection {
    background: #111;
    padding: 25px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 18px;
}

.card {
    background: #222;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
}

.card canvas {
    width: 100%;
    border-radius: 5px;
}

.card h3 {
    margin: 9px 0;
    font-size: 15px;
}

@media(max-width: 850px) {
    .app {
        grid-template-columns: 1fr;
    }

    #collection {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media(max-width: 550px) {
    #collection {
        grid-template-columns: repeat(2, 1fr);
        padding: 12px;
        gap: 10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Area Colour Collection Creator</h1>
    <p>Upload an image, detect its areas, then create ten colour variations.</p>
</header>


<div class="app">

    <div class="viewer">
        <div class="viewer-inner">
            <canvas id="canvas"></canvas>
        </div>
    </div>


    <aside class="controls">

        <div class="section">

            <label>
                1. Upload image
            </label>

            <input
                id="fileInput"
                type="file"
                accept="image/*"
            >

        </div>


        <div class="section">

            <label>
                2. Area sensitivity
            </label>

            <input
                id="tolerance"
                type="number"
                min="1"
                max="100"
                value="25"
            >

            <div class="info">
                Lower values keep colours more separate.
                Higher values combine similar shades into
                the same area.
            </div>

            <button
                id="detectButton"
                disabled
            >
                DETECT ALL AREAS
            </button>

        </div>


        <div class="section">

            <div class="info">

                <strong>Detected areas:</strong>

                <div id="areaCount">
                    None
                </div>

            </div>

        </div>


        <div class="section">

            <button
                id="randomButton"
                class="secondary"
                disabled
            >
                APPLY RANDOM COLOURS
            </button>

            <button
                id="createButton"
                disabled
            >
                CREATE 10 VARIATIONS
            </button>

        </div>


        <div id="status">
            Upload an image to begin.
        </div>

    </aside>

</div>


<div id="collection"></div>


<script>

/*
==========================================================
GLOBAL DATA
==========================================================
*/

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );

const fileInput =
    document.getElementById("fileInput");

const toleranceInput =
    document.getElementById("tolerance");

const detectButton =
    document.getElementById("detectButton");

const randomButton =
    document.getElementById("randomButton");

const createButton =
    document.getElementById("createButton");

const status =
    document.getElementById("status");

const areaCount =
    document.getElementById("areaCount");

const collection =
    document.getElementById("collection");


let originalPixels = null;

let regionMap = null;

let regions = [];

let imageWidth = 0;

let imageHeight = 0;


/*
==========================================================
UPLOAD
==========================================================
*/

fileInput.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];

        if (!file) {
            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                const image =
                    new Image();


                image.onload =
                    function() {

                        imageWidth =
                            image.width;

                        imageHeight =
                            image.height;


                        canvas.width =
                            imageWidth;

                        canvas.height =
                            imageHeight;


                        ctx.drawImage(
                            image,
                            0,
                            0
                        );


                        const pixels =
                            ctx.getImageData(
                                0,
                                0,
                                imageWidth,
                                imageHeight
                            );


                        originalPixels =
                            new Uint8ClampedArray(
                                pixels.data
                            );


                        regionMap = null;

                        regions = [];


                        detectButton.disabled =
                            false;

                        randomButton.disabled =
                            true;

                        createButton.disabled =
                            true;


                        collection.innerHTML =
                            "";


                        areaCount.textContent =
                            "Not detected";


                        status.textContent =
                            "Image loaded. Click DETECT ALL AREAS.";

                    };


                image.src =
                    e.target.result;

            };


        reader.readAsDataURL(file);

    }
);


/*
==========================================================
DETECT ALL AREAS
==========================================================
*/

detectButton.addEventListener(
    "click",
    function() {

        if (!originalPixels) {
            return;
        }


        status.textContent =
            "Detecting areas...";


        /*
        Give the browser a moment to
        update the status before doing
        the calculation.
        */

        setTimeout(
            detectRegions,
            30
        );

    }
);


/*
==========================================================
REGION DETECTION
==========================================================

Every connected area gets a unique
region number.

IMPORTANT:

Two areas can have exactly the
same colour and still become two
different regions if they are not
physically connected.

==========================================================
*/

function detectRegions() {

    const width =
        imageWidth;

    const height =
        imageHeight;


    const total =
        width * height;


    const tolerance =
        Math.max(
            1,
            Math.min(
                100,
                Number(
                    toleranceInput.value
                ) || 25
            )
        );


    /*
    Region ID for every pixel.

    -1 = not processed
    */

    regionMap =
        new Int32Array(total);

    regionMap.fill(-1);


    regions = [];


    /*
    We compare each pixel with the
    neighbouring pixels.

    The tolerance determines whether
    two neighbouring pixels belong
    to the same region.
    */

    for (
        let y = 0;
        y < height;
        y++
    ) {

        for (
            let x = 0;
            x < width;
            x++
        ) {

            const start =
                y * width + x;


            if (
                regionMap[start] !== -1
            ) {
                continue;
            }


            const regionId =
                regions.length;


            const pixels = [];

            const queue = [];


            queue.push(start);

            regionMap[start] =
                regionId;


            let queuePosition = 0;


            while (
                queuePosition <
                queue.length
            ) {

                const index =
                    queue[
                        queuePosition++
                    ];


                pixels.push(index);


                const px =
                    index % width;

                const py =
                    Math.floor(
                        index / width
                    );


                /*
                Check four neighbours.
                */

                checkNeighbour(
                    px - 1,
                    py
                );

                checkNeighbour(
                    px + 1,
                    py
                );

                checkNeighbour(
                    px,
                    py - 1
                );

                checkNeighbour(
                    px,
                    py + 1
                );

            }


            /*
            Store region.
            */

            regions.push({

                id:
                    regionId,

                pixels:
                    pixels,

                colour:
                    randomColour()

            });


            function checkNeighbour(
                nx,
                ny
            ) {

                if (
                    nx < 0 ||
                    nx >= width ||
                    ny < 0 ||
                    ny >= height
                ) {
                    return;
                }


                const neighbour =
                    ny * width + nx;


                if (
                    regionMap[neighbour] !== -1
                ) {
                    return;
                }


                const a =
                    index * 4;

                const b =
                    neighbour * 4;


                const dr =
                    originalPixels[a] -
                    originalPixels[b];

                const dg =
                    originalPixels[a + 1] -
                    originalPixels[b + 1];

                const db =
                    originalPixels[a + 2] -
                    originalPixels[b + 2];


                const distance =
                    Math.sqrt(
                        dr * dr +
                        dg * dg +
                        db * db
                    );


                if (
                    distance <= tolerance
                ) {

                    regionMap[neighbour] =
                        regionId;

                    queue.push(
                        neighbour
                    );

                }

            }

        }

    }


    /*
    Very tiny regions are merged
    with their original appearance.

    We don't want millions of tiny
    one-pixel regions.
    */

    const minimumSize =
        Math.max(
            10,
            Math.floor(
                total * 0.00005
            )
        );


    regions =
        regions.filter(
            region =>
                region.pixels.length >=
                minimumSize
        );


    /*
    Re-number regions after filtering.
    */

    regions.forEach(
        function(region, index) {

            region.id = index;

        }
    );


    /*
    Show boundary map.
    */

    drawBoundaryMap();


    areaCount.textContent =
        regions.length +
        " areas detected";


    randomButton.disabled =
        regions.length === 0;

    createButton.disabled =
        regions.length === 0;


    status.textContent =
        "All areas detected. The coloured boundaries show the regions that will be changed.";

}


/*
==========================================================
DRAW BOUNDARIES
==========================================================
*/

function drawBoundaryMap() {

    const data =
        new Uint8ClampedArray(
            originalPixels
        );


    const width =
        imageWidth;

    const height =
        imageHeight;


    /*
    Make each region slightly tinted
    so the boundaries are easy to see.
    */

    for (
        let y = 0;
        y < height;
        y++
    ) {

        for (
            let x = 0;
            x < width;
            x++
        ) {

            const index =
                y * width + x;


            /*
            Ignore pixels that weren't
            retained as a region.
            */

            const region =
                getRegionAt(
                    index
                );


            if (
                region === -1
            ) {
                continue;
            }


            let boundary = false;


            if (
                x === 0 ||
                getRegionAt(
                    index - 1
                ) !== region
            ) {
                boundary = true;
            }


            if (
                x === width - 1 ||
                getRegionAt(
                    index + 1
                ) !== region
            ) {
                boundary = true;
            }


            if (
                y === 0 ||
                getRegionAt(
                    index - width
                ) !== region
            ) {
                boundary = true;
            }


            if (
                y === height - 1 ||
                getRegionAt(
                    index + width
                ) !== region
            ) {
                boundary = true;
            }


            if (boundary) {

                const p =
                    index * 4;


                data[p] = 255;
                data[p + 1] = 255;
                data[p + 2] = 0;

            }

        }

    }


    ctx.putImageData(
        new ImageData(
            data,
            width,
            height
        ),
        0,
        0
    );

}


/*
==========================================================
GET REGION
==========================================================
*/

function getRegionAt(index) {

    if (
        index < 0 ||
        index >= regionMap.length
    ) {
        return -1;
    }


    const id =
        regionMap[index];


    if (
        id < 0 ||
        id >= regions.length
    ) {
        return -1;
    }


    return id;

}


/*
==========================================================
RANDOM COLOURS
==========================================================
*/

randomButton.addEventListener(
    "click",
    function() {

        if (
            regions.length === 0
        ) {
            return;
        }


        regions.forEach(
            function(region) {

                region.colour =
                    randomColour();

            }
        );


        drawColouredImage();


        status.textContent =
            "A new colour has been applied to every detected area.";

    }
);


/*
==========================================================
DRAW COLOURED IMAGE
==========================================================
*/

function drawColouredImage() {

    const data =
        new Uint8ClampedArray(
            originalPixels
        );


    regions.forEach(
        function(region) {

            const rgb =
                hexToRGB(
                    region.colour
                );


            region.pixels.forEach(
                function(index) {

                    const p =
                        index * 4;


                    data[p] =
                        rgb.r;

                    data[p + 1] =
                        rgb.g;

                    data[p + 2] =
                        rgb.b;

                }
            );

        }
    );


    ctx.putImageData(
        new ImageData(
            data,
            imageWidth,
            imageHeight
        ),
        0,
        0
    );

}


/*
==========================================================
CREATE 10 VARIATIONS
==========================================================

Every variation starts from the
same original image and the SAME
region map.

Each region receives ONE flat colour.

Therefore:

Area A cannot accidentally
change Area B.

==========================================================
*/

createButton.addEventListener(
    "click",
    function() {

        if (
            regions.length === 0
        ) {
            return;
        }


        collection.innerHTML = "";


        for (
            let variation = 1;
            variation <= 10;
            variation++
        ) {

            const output =
                document.createElement(
                    "canvas"
                );


            output.width =
                imageWidth;

            output.height =
                imageHeight;


            const outputCtx =
                output.getContext(
                    "2d"
                );


            const data =
                new Uint8ClampedArray(
                    originalPixels
                );


            /*
            Generate ONE colour for
            each region.

            That colour is then used
            for every pixel belonging
            to that region.
            */

            regions.forEach(
                function(region) {

                    const colour =
                        randomColourRGB();


                    region.pixels.forEach(
                        function(index) {

                            const p =
                                index * 4;


                            data[p] =
                                colour.r;

                            data[p + 1] =
                                colour.g;

                            data[p + 2] =
                                colour.b;

                        }
                    );

                }
            );


            outputCtx.putImageData(
                new ImageData(
                    data,
                    imageWidth,
                    imageHeight
                ),
                0,
                0
            );


            /*
            Collection card.
            */

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const title =
                document.createElement(
                    "h3"
                );


            title.textContent =
                "Variation " +
                String(
                    variation
                ).padStart(
                    2,
                    "0"
                );


            const download =
                document.createElement(
                    "button"
                );


            download.textContent =
                "DOWNLOAD PNG";


            download.addEventListener(
                "click",
                function() {

                    output.toBlob(
                        function(blob) {

                            if (!blob) {
                                return;
                            }


                            const url =
                                URL.createObjectURL(
                                    blob
                                );


                            const link =
                                document.createElement(
                                    "a"
                                );


                            link.href =
                                url;


                            link.download =
                                "variation-" +
                                String(
                                    variation
                                ).padStart(
                                    2,
                                    "0"
                                ) +
                                ".png";


                            link.click();


                            setTimeout(
                                function() {

                                    URL.revokeObjectURL(
                                        url
                                    );

                                },
                                1000
                            );

                        },
                        "image/png"
                    );

                }
            );


            card.appendChild(
                output
            );

            card.appendChild(
                title
            );

            card.appendChild(
                download
            );


            collection.appendChild(
                card
            );

        }


        status.textContent =
            "10 complete variations created.";

    }
);


/*
==========================================================
RANDOM HEX
==========================================================
*/

function randomColour() {

    const letters =
        "0123456789ABCDEF";


    let result = "#";


    for (
        let i = 0;
        i < 6;
        i++
    ) {

        result +=
            letters[
                Math.floor(
                    Math.random() *
                    16
                )
            ];

    }


    return result;

}


/*
==========================================================
RANDOM RGB
==========================================================
*/

function randomColourRGB() {

    return {

        r:
            Math.floor(
                Math.random() * 256
            ),

        g:
            Math.floor(
                Math.random() * 256
            ),

        b:
            Math.floor(
                Math.random() * 256
            )

    };

}


/*
==========================================================
HEX → RGB
==========================================================
*/

function hexToRGB(hex) {

    hex =
        hex.replace(
            "#",
            ""
        );


    return {

        r:
            parseInt(
                hex.substring(
                    0,
                    2
                ),
                16
            ),

        g:
            parseInt(
                hex.substring(
                    2,
                    4
                ),
                16
            ),

        b:
            parseInt(
                hex.substring(
                    4,
                    6
                ),
                16
            )

    };

}

</script>

</body>
</html>
