<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-touch-inspector@1.1.2/dist/aframe-inspector.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#cadboxxMenus{position:fixed;left:10px;bottom:175px;z-index:100000}
#menuSelectors{display:flex;flex-direction:column;gap:3px}
#menuSelectors button{width:78px;height:45px;padding:0;border:1px solid rgba(255,255,255,.8);border-radius:4px;color:#fff;font:bold 12px Arial,sans-serif;cursor:pointer}
#commandSets{position:fixed;left:0;right:0;top:10px;z-index:100000}
.commandSet{display:none;gap:5px;padding:0 10px;width:100%;box-sizing:border-box}
.commandSet button{flex:1;width:auto;height:42px;padding:0;border:1px solid rgba(255,255,255,.8);border-radius:4px;background:var(--menu-color);color:#fff;font:bold 12px Arial,sans-serif;cursor:pointer}
.commandSet button.home{flex:0 0 42px;width:42px;height:30px;align-self:center;font-size:10px}
</style>
</head>
<body>
<div id="cadboxxMenus">
  <div id="menuSelectors">
    <button id="menuCreate" style="background:#d32f2f" onclick="showMenu('commandSetCreate')">CREATE</button>
    <button id="menuEdit" style="background:#1976d2" onclick="showMenu('commandSetEdit')">EDIT</button>
    <button id="menuConstrain" style="background:#388e3c" onclick="showMenu('commandSetConstrain')">CONSTRAIN</button>
    <button id="menuAssembly" style="background:#7b1fa2" onclick="showMenu('commandSetAssembly')">ASSEMBLY</button>
    <button id="menuView" style="background:#f57c00" onclick="showMenu('commandSetView')">VIEW</button>
    <button id="menuSimulate" style="background:#00838f" onclick="showMenu('commandSetSimulate')">SIMULATE</button>
  </div>
</div>

<div id="commandSets">
  <div id="commandSetCreate" class="commandSet" style="--menu-color:#d32f2f">
    <button id="createAddPart" onclick="cadCommand('createAddPart')">ADD PART</button>
    <button id="createImport" onclick="cadCommand('createImport')">IMPORT</button>
    <button id="createDraw" onclick="cadCommand('createDraw')">DRAW</button>
    <button id="createExtrude" onclick="cadCommand('createExtrude')">EXTRUDE</button>
    <button id="createFinish" onclick="cadCommand('createFinish')">FINISH</button>
    <button id="createHome" class="home" onclick="showHome('createHome')">HOME</button>
  </div>

  <div id="commandSetEdit" class="commandSet" style="--menu-color:#1976d2">
    <button id="editMove" onclick="cadCommand('editMove')">MOVE</button>
    <button id="editRotate" onclick="cadCommand('editRotate')">ROTATE</button>
    <button id="editScale" onclick="cadCommand('editScale')">SCALE</button>
    <button id="editDelete" onclick="cadCommand('editDelete')">DELETE</button>
    <button id="editProperties" onclick="cadCommand('editProperties')">PROPERTIES</button>
    <button id="editHome" class="home" onclick="showHome('editHome')">HOME</button>
  </div>

  <div id="commandSetConstrain" class="commandSet" style="--menu-color:#388e3c">
    <button id="constrainAlign" onclick="cadCommand('constrainAlign')">ALIGN</button>
    <button id="constrainHinge" onclick="cadCommand('constrainHinge')">HINGE</button>
    <button id="constrainSlider" onclick="cadCommand('constrainSlider')">SLIDER</button>
    <button id="constrainFix" onclick="cadCommand('constrainFix')">FIX</button>
    <button id="constrainDistance" onclick="cadCommand('constrainDistance')">DISTANCE</button>
    <button id="constrainHome" class="home" onclick="showHome('constrainHome')">HOME</button>
  </div>

  <div id="commandSetAssembly" class="commandSet" style="--menu-color:#7b1fa2">
    <button id="assemblyInsert" onclick="cadCommand('assemblyInsert')">INSERT</button>
    <button id="assemblyMate" onclick="cadCommand('assemblyMate')">MATE</button>
    <button id="assemblyPattern" onclick="cadCommand('assemblyPattern')">PATTERN</button>
    <button id="assemblyReplace" onclick="cadCommand('assemblyReplace')">REPLACE</button>
    <button id="assemblyExplode" onclick="cadCommand('assemblyExplode')">EXPLODE</button>
    <button id="assemblyHome" class="home" onclick="showHome('assemblyHome')">HOME</button>
  </div>

  <div id="commandSetView" class="commandSet" style="--menu-color:#f57c00">
    <button id="viewFront" onclick="cadCommand('viewFront')">FRONT</button>
    <button id="viewTop" onclick="cadCommand('viewTop')">TOP</button>
    <button id="viewSide" onclick="cadCommand('viewSide')">SIDE</button>
    <button id="viewFit" onclick="cadCommand('viewFit')">FIT</button>
    <button id="viewSection" onclick="cadCommand('viewSection')">SECTION</button>
    <button id="viewHome" class="home" onclick="showHome('viewHome')">HOME</button>
  </div>

  <div id="commandSetSimulate" class="commandSet" style="--menu-color:#00838f">
    <button id="simulateGravity" onclick="cadCommand('simulateGravity')">GRAVITY</button>
    <button id="simulatePhysics" onclick="cadCommand('simulatePhysics')">PHYSICS</button>
    <button id="simulateAnimate" onclick="cadCommand('simulateAnimate')">ANIMATE</button>
    <button id="simulateRecord" onclick="cadCommand('simulateRecord')">RECORD</button>
    <button id="simulateStop" onclick="cadCommand('simulateStop')">STOP</button>
    <button id="simulateHome" class="home" onclick="showHome('simulateHome')">HOME</button>
  </div>
</div>

<script>
function hideAllCommandSets(){
  document.querySelectorAll('.commandSet').forEach(function(set){
    set.style.display='none';
  });
}

function showMenu(setId){
  hideAllCommandSets();
  document.getElementById('menuSelectors').style.display='none';
  document.getElementById(setId).style.display='flex';
}

function showHome(buttonId){
  hideAllCommandSets();
  document.getElementById('menuSelectors').style.display='flex';
  console.log('HOME:', buttonId);
}

function cadCommand(commandId){
  console.log('CADBOXX command:', commandId);
  // Add the CADBOXX action for this unique command ID here.
}
</script>
